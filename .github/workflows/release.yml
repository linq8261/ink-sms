name: Release APK

# 打 tag 后自动构建已签名 APK 并发布到 GitHub Release
# tag 格式：YYYYMMDD-versionName-versionCode，例如 20261023-1.0.2-3
on:
  push:
    tags:
      - '*'                     # tag 格式在第一步里校验，不符合直接失败
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag，如 20261023-1.0.2-3'
        required: true
        default: ''
      dry_run:
        description: '只构建、不发布'
        type: boolean
        default: true

permissions:
  contents: write               # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 手动触发用输入的 tag，push tag 触发用 ref 名；
      # 这里用 shell 决定而不是在 env 里写表达式，避免表达式上下文引发的校验问题
      - name: 解析 tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: 校验 tag 与版本号
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^([0-9]{8})-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "::error::tag 格式应为 YYYYMMDD-x.y.z-N，实际：$TAG_NAME"
            exit 1
          fi
          TAG_VER="${BASH_REMATCH[2]}"
          TAG_CODE="${BASH_REMATCH[3]}"
          FILE_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          FILE_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "tag=$TAG_NAME / 仓库 versionName=$FILE_VER versionCode=$FILE_CODE"
          if [[ "$TAG_VER" != "$FILE_VER" || "$TAG_CODE" != "$FILE_CODE" ]]; then
            echo "::error::tag 里的版本($TAG_VER/$TAG_CODE) 与 build.gradle.kts($FILE_VER/$FILE_CODE) 不一致，先把版本号改好再打 tag"
            exit 1
          fi
          echo "APK_NAME=ink-sms-$FILE_VER-$FILE_CODE.apk" >> "$GITHUB_ENV"

      # 本机 JDK 21，AGP 9 对 Gradle 版本有下限要求，两边保持一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 仓库里的 wrapper 指向腾讯镜像的 9.3.1，CI 上直接交给 setup-gradle 装同版本，
      # 不读仓库里的 wrapper 属性，避免镜像不可达导致卡住
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 还原签名配置
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          if [ ! -s keystore.jks ]; then
            echo "::error::keystore.jks 为空：请检查 KEYSTORE_BASE64 这个 Secret 是否已配置"
            exit 1
          fi
          ls -l keystore.jks
          # app/build.gradle.kts 里 storeFile = file(keystorePath)，相对路径是按 :app 模块目录解析的，
          # 所以必须写 ../keystore.jks 才能指到仓库根目录下刚还原出来的这个文件
          printf 'signing.storeFile=../keystore.jks\nsigning.storePassword=%s\nsigning.keyAlias=%s\nsigning.keyPassword=%s\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' '${{ secrets.KEY_PASSWORD }}' \
            > local.properties
          sed 's/Password=.*/Password=***/' local.properties

      - name: 构建 release APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "无法列出 platforms"
          gradle --version
          # runner 用 bash -e 执行，pipefail 会让失败直接退出、跳过下面的诊断，所以这里先关掉
          set +e
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # 只打 tail 会被 org.gradle.* 的堆栈帧占满，真正的根因在 "What went wrong" 段里，
            # 所以优先抽出那一段打成注解（每步最多约 10 条 error 注解，够用）
            echo "::error::Gradle 构建失败（exit=$STATUS，日志 $(wc -l < gradle-build.log) 行）"
            grep -n -m1 -A 12 'What went wrong' gradle-build.log > fail-reason.log || true
            if [ -s fail-reason.log ]; then
              tail -n +2 fail-reason.log | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            else
              tail -n 10 gradle-build.log | while IFS= read -r line; do echo "::error::$line"; done
            fi
            ls -l app/build/outputs/apk/release/ 2>/dev/null || echo "release 输出目录不存在"
            exit 1
          fi
          ls -l app/build/outputs/apk/release/
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: 试跑时上传产物
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          retention-days: 3

      - name: 创建 GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" "$APK_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
